# Space Engineers PCU overrides
#
# Some vanilla block definitions do not contain a <PCU> element in their
# .sbc definition. Add those values here as:
#
# SubtypeId=PCU
#
# For blocks whose blueprint has an empty <SubtypeName />, use the TypeId
# itself as the key (for example: OxygenGenerator=50).
#
# Keep this file limited to values that are genuinely absent from the XML.

IrrigationSystem=50
LargeBlockLargeGenerator=25
LargeBlockLargeGeneratorWarfare2=25
LargeBlockOxygenFarm=25
LargeBlockOxygenFarmReskin=25
LargeBlockOxygenGeneratorLab=50
LargeBlockPrototechOxygenGenerator=50
LargeBlockSmallGenerator=25
LargeBlockSmallGeneratorWarfare2=25
LargeHydrogenEngine=25
LargeHydrogenEngineReskin=25
LargePrototechReactor=25
OxygenGenerator=50
SmallBlockLargeGenerator=25
SmallBlockLargeGeneratorWarfare2=25
SmallBlockSmallGenerator=25
SmallBlockSmallGeneratorWarfare2=25
SmallBlockOxygenGeneratorLab=50
SmallHydrogenEngine=25
SmallHydrogenEngineReskin=25
